name: Heatmap

on:
  schedule:
    # Just after midnight UTC, so the heatmap shows the day that just ended.
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/heatmap.yml]

permissions:
  contents: write

concurrency: heatmap

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the heatmap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-heatmap.py
      - name: Commit the heatmap if it changed
        shell: bash
        run: |
          git add contributions.svg
          if git diff --cached --quiet; then
            echo "The heatmap is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "heatmap: redraw the contributions grid"
          git push --quiet
